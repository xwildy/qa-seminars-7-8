<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BookMarket — тестовый стенд</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f2f4f7; color: #21262d; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: #ffffff; border-bottom: 1px solid #dde3ea; }
  .logo { font-weight: 700; font-size: 17px; }
  .nav-link { color: #1f6feb; text-decoration: none; font-size: 14px; cursor: pointer; background: none; border: none; padding: 4px 6px; }
  .spacer { flex: 1; }
  .badge { background: #1f6feb; color: #fff; border-radius: 10px; font-size: 12px; padding: 1px 7px; }
  main { max-width: 640px; margin: 24px auto; padding: 0 14px; }
  section { background: #fff; border: 1px solid #dde3ea; border-radius: 10px; padding: 18px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  input { display: block; width: 100%; padding: 9px 10px; margin-bottom: 10px; border: 1px solid #ccd2d8; border-radius: 6px; font-size: 14px; }
  button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px; padding: 9px 14px; font-size: 14px; cursor: pointer; }
  .error { color: #c22; font-size: 13px; min-height: 18px; margin: 4px 0 8px; }
  .book-row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #eef1f4; }
  .book-row .t { flex: 1; font-size: 14px; }
  .book-row .p { color: #555; font-size: 13px; }
  .hidden { display: none; }
  .cart-line { display: flex; justify-content: space-between; padding: 8px 2px; border-bottom: 1px solid #eef1f4; font-size: 14px; }
  .total { font-weight: 700; font-size: 16px; margin-top: 10px; }
  .muted { color: #6a7683; font-size: 12px; }
</style>
</head>
<body>
<header>
  <span class="logo">📚 BookMarket — авто-стенд</span>
  <span class="spacer"></span>
  <button class="nav-link" id="nav-login" data-test="nav-login">Вход</button>
  <button class="nav-link hidden" id="nav-catalog" data-test="nav-catalog">Каталог</button>
  <button class="nav-link hidden" id="nav-cart" data-test="nav-cart">Корзина <span class="badge" id="cart-badge" data-test="cart-badge">0</span></button>
</header>
<main>
  <!-- Экран входа -->
  <section id="section-login" data-test="section-login">
    <h1>Вход</h1>
    <input type="text" id="login-email" placeholder="Email" data-test="login-email">
    <input type="password" id="login-password" placeholder="Пароль" data-test="login-password">
    <div class="error" id="login-error" data-test="login-error"></div>
    <button id="login-button" data-test="login-button">Войти</button>
    <p class="muted">Тестовый аккаунт: qa@bookmarket.local / correct-horse</p>
  </section>

  <!-- Каталог -->
  <section id="section-catalog" class="hidden" data-test="section-catalog">
    <h1>Каталог</h1>
    <div id="book-list" data-test="book-list"></div>
  </section>

  <!-- Корзина -->
  <section id="section-cart" class="hidden" data-test="section-cart">
    <h1>Корзина</h1>
    <div id="cart-lines" data-test="cart-lines"></div>
    <div class="total">Итого: <span id="cart-total" data-test="cart-total">0</span> руб.</div>
    <p class="muted">Демо-корзина: оформление не выполняется.</p>
  </section>
</main>

<script>
// Книги каталога
const BOOKS = [
  { id: 1, title: "Чистый код", price: 1290 },
  { id: 2, title: "Совершенный код", price: 1850 },
  { id: 3, title: "Тестирование Дот Ком", price: 990 },
  { id: 4, title: "Рефакторинг", price: 2100 }
];

const CREDENTIALS = { email: "qa@bookmarket.local", password: "correct-horse" };

let cart = {};  // id -> qty

const $ = (id) => document.getElementById(id);

function show(sectionId) {
  ["section-login", "section-catalog", "section-cart"].forEach(id => {
    $(id).classList.toggle("hidden", id !== sectionId);
  });
}

// Навигация зависит от состояния входа: до входа видна только кнопка «Вход»
function setNavVisibility(loggedIn) {
  $("nav-login").classList.toggle("hidden", loggedIn);
  $("nav-catalog").classList.toggle("hidden", !loggedIn);
  $("nav-cart").classList.toggle("hidden", !loggedIn);
}

function renderBadge() {
  const n = Object.values(cart).reduce((a, b) => a + b, 0);
  $("cart-badge").textContent = String(n);
}

function renderCart() {
  const box = $("cart-lines");
  box.innerHTML = "";
  let total = 0;
  for (const book of BOOKS) {
    if (!cart[book.id]) continue;
    total += book.price * cart[book.id];
    const line = document.createElement("div");
    line.className = "cart-line";
    line.setAttribute("data-test", "cart-line");
    line.innerHTML = "<span>" + book.title + " x" + cart[book.id] + "</span><span>" +
      (book.price * cart[book.id]) + " руб.</span>";
    box.appendChild(line);
  }
  if (total === 0) {
    box.innerHTML = "<div class='muted'>Корзина пуста</div>";
  }
  $("cart-total").textContent = String(total);
}

function renderCatalog() {
  const box = $("book-list");
  box.innerHTML = "";
  for (const book of BOOKS) {
    const row = document.createElement("div");
    row.className = "book-row";
    row.setAttribute("data-test", "book-" + book.id);
    row.innerHTML = "<span class='t'>" + book.title + "</span>" +
      "<span class='p'>" + book.price + " руб.</span>";
    const btn = document.createElement("button");
    btn.textContent = "В корзину";
    btn.setAttribute("data-test", "add-" + book.id);
    btn.addEventListener("click", () => {
      cart[book.id] = (cart[book.id] || 0) + 1;
      renderBadge();
      renderCart();
    });
    row.appendChild(btn);
    box.appendChild(row);
  }
}

// Вход: проверка кредов; ошибка показывается в #login-error
$("login-button").addEventListener("click", () => {
  const email = $("login-email").value.trim();
  const password = $("login-password").value;
  if (email === CREDENTIALS.email && password === CREDENTIALS.password) {
    $("login-error").textContent = "";
    sessionStorage.setItem("bm-logged-in", "1");
    renderCatalog();
    renderBadge();
    setNavVisibility(true);
    show("section-catalog");
  } else {
    $("login-error").textContent = "Неверный email или пароль";
  }
});

$("nav-login").addEventListener("click", () => show("section-login"));
$("nav-catalog").addEventListener("click", () => { renderCatalog(); show("section-catalog"); });
$("nav-cart").addEventListener("click", () => { renderCart(); show("section-cart"); });

// Если сессия уже была "залогинена" (тот же таб, перезагрузки страницы)
if (sessionStorage.getItem("bm-logged-in") === "1") {
  renderCatalog();
  setNavVisibility(true);
  show("section-catalog");
} else {
  setNavVisibility(false);
}
</script>
</body>
</html>
