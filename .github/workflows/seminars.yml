name: Seminars 7-8 test runs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Unpack sources from bundle.txt
        run: |
          python3 - <<'PY'
          import os, re
          if os.path.exists('bundle.txt'):
              data = open('bundle.txt', encoding='utf-8').read()
              parts = re.split(r'^%%%FILE (.+?)%%%\n', data, flags=re.M)
              files = {parts[i]: parts[i + 1] for i in range(1, len(parts), 2)}

              def w(path, text):
                  os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
                  open(path, 'w', encoding='utf-8').write(text)

              for k, t in files.items():
                  if not k.startswith('shared/'):
                      w(k, t)
              for d in ['seminar7', 'seminar7-original']:
                  w(d + '/pom.xml', files['shared/pom7.xml'])
                  w(d + '/test-app/shop.html', files['shared/shop7.html'])
              w('seminar8/pom.xml', files['shared/pom8.xml'])
              w('seminar8-original/pom.xml',
                files['shared/pom7.xml'].replace('seminar7-start', 'seminar8-flaky'))
              for d in ['seminar8', 'seminar8-original']:
                  w(d + '/test-app/shop.html', files['shared/shop8.html'])
              for d in ['seminar7', 'seminar7-original', 'seminar8', 'seminar8-original']:
                  w(d + '/src/test/java/ru/qa/course/core/ChromeDriverResolver.java',
                    files['shared/ChromeDriverResolver.java'])
              os.remove('bundle.txt')
              print('unpacked', len(files), 'files')
          PY
          find . -path ./.git -prune -o -type f -print | sort

      - name: Run test suites
        run: bash ci/run_all.sh

      - name: Commit sources and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sources, test runs and Allure report [skip ci]" || echo "nothing to commit"
          git push
